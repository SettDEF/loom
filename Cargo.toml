[package]
name = "loom"
version = "0.1.0"
edition = "2024"
description = "A Wayland compositor that speaks Hyprland's and KDE's protocols"
license = "MIT OR Apache-2.0"

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman", "renderer_gl", "backend_winit", "backend_egl", "xwayland", "backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev"] }
png = "0.17"
serde_json = "1"
wayland-server = "0.31"
wayland-scanner = "0.31"
bitflags = "2"
libc = "0.2"
regex = "1"
xcursor = "0.3"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
inotify = "0.11"
cosmic-text = "0.14"
tiny-skia = "0.11"
rquickjs = { version = "0.9", features = ["classes", "properties"] }

# smithay with a fix: a destroyed layer surface's next commit no longer kills the client
[patch.crates-io]
smithay = { path = "vendor/smithay" }
